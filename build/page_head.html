<title>Where in the World is Nick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#eef1f4; --surface:#fbfcfd; --surface-2:#f5f7f9;
  --ink:#101619; --ink-2:#4d585f; --muted:#7f8b92;
  --rule:#dde3e8; --rule-soft:#e7ecef;
  --k0:#2a78d6; --k1:#eb6834; --k2:#1baf7a; --k3:#eda100; --k4:#e87ba4; --k5:#008300; --k6:#4a3aa7;
  --bx:#9aa5ac; --track:#e3e8ec;
  --land:#d5dde4; --land-line:#c2ccd4; --sea:#eaeef2;
  --shadow:0 1px 2px rgba(16,22,25,.05), 0 8px 24px -16px rgba(16,22,25,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0b0f12; --surface:#141a1e; --surface-2:#191f24;
    --ink:#eef3f6; --ink-2:#aeb9c0; --muted:#78848b;
    --rule:#232b31; --rule-soft:#1d242a;
    --k0:#3987e5; --k1:#d95926; --k2:#199e70; --k3:#c98500; --k4:#d55181; --k5:#008300; --k6:#9085e9;
    --bx:#6d787f; --track:#20272d;
    --land:#222a30; --land-line:#2e383f; --sea:#0f1418;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0b0f12; --surface:#141a1e; --surface-2:#191f24;
  --ink:#eef3f6; --ink-2:#aeb9c0; --muted:#78848b;
  --rule:#232b31; --rule-soft:#1d242a;
  --k0:#3987e5; --k1:#d95926; --k2:#199e70; --k3:#c98500; --k4:#d55181; --k5:#008300; --k6:#9085e9;
  --bx:#6d787f; --track:#20272d;
  --land:#222a30; --land-line:#2e383f; --sea:#0f1418;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px 90px}
@media (max-width:640px){ .wrap{padding:0 14px 60px} }

h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif; margin:0; text-wrap:balance}
h1{font-weight:800; font-size:clamp(2.1rem,5.4vw,3.6rem); line-height:.98; letter-spacing:-.035em}
h2{font-weight:700; font-size:clamp(1.3rem,2.7vw,1.75rem); line-height:1.12; letter-spacing:-.02em}
h3{font-weight:600; font-size:1rem; letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.67rem; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}

/* ---------- masthead + tabs ---------- */
.masthead{padding:44px 0 0}
@media (max-width:640px){ .masthead{padding:26px 0 0} }
.mast-top{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:18px}
h1 .em{color:var(--k1)}
.tagline{color:var(--ink-2); margin:14px 0 0; max-width:60ch}

.tabbar{position:sticky; top:0; z-index:40; background:var(--ground); border-bottom:1px solid var(--rule);
  margin-top:26px; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:13px 14px; font:inherit; font-size:.9rem; color:var(--muted); white-space:nowrap;
  font-weight:500; transition:color .15s, border-color .15s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--k0); font-weight:600}
.tab:focus-visible{outline:2px solid var(--k0); outline-offset:-4px; border-radius:4px}

.panelwrap{padding-top:34px}
.lede{color:var(--ink-2); max-width:66ch; margin:0 0 24px; font-size:.95rem}
.sec{margin-top:44px}
.sec:first-child{margin-top:0}
.sec-head{display:flex; align-items:baseline; gap:14px; margin-bottom:8px}
.sec-head .rule{flex:1; height:1px; background:var(--rule)}

/* ---------- tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--rule);
  border:1px solid var(--rule); border-radius:10px; overflow:hidden}
.tile{background:var(--surface); padding:17px 17px 15px; display:flex; flex-direction:column; gap:3px}
.tile .v{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:1.9rem; line-height:1; letter-spacing:-.03em}
.tile .l{font-size:.79rem; color:var(--ink-2)}
.tile .n{font-size:.71rem; color:var(--muted)}

.panel{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:20px; box-shadow:var(--shadow)}
@media (max-width:640px){ .panel{padding:13px} }

/* ---------- legend ---------- */
.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.lg{display:inline-flex; align-items:center; gap:7px; font-size:.8rem; color:var(--ink-2)}
.sw{width:11px; height:11px; border-radius:3px; flex:none}
.sw.k0{background:var(--k0)} .sw.k1{background:var(--k1)} .sw.k2{background:var(--k2)}
.sw.k3{background:var(--k3)} .sw.k4{background:var(--k4)} .sw.k5{background:var(--k5)}
.sw.k6{background:var(--k6)} .sw.bx{background:var(--bx)}
.lg .num{color:var(--muted); font-family:"JetBrains Mono",monospace; font-size:.75rem; font-variant-numeric:tabular-nums}

/* ---------- ribbon ---------- */
.ribbon-row{display:grid; grid-template-columns:52px 1fr; gap:14px; align-items:center; margin-bottom:11px}
.ribbon-row .yr{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:1.1rem; letter-spacing:-.02em}
.ribbon-row .yr small{display:block; font-family:"JetBrains Mono",monospace; font-weight:400; font-size:.65rem; color:var(--muted); letter-spacing:0}

.scroller{overflow-x:auto; -webkit-overflow-scrolling:touch}
.scroller > svg{display:block}

/* ---------- bars ---------- */
.bars{display:flex; flex-direction:column; gap:9px}
.bar-row{display:grid; grid-template-columns:150px 1fr 96px; gap:12px; align-items:center; font-size:.86rem}
@media (max-width:560px){ .bar-row{grid-template-columns:104px 1fr 80px; font-size:.79rem} }
.bar-row .nm{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{height:15px; background:var(--track); border-radius:4px; overflow:hidden}
.bar-fill{height:100%; border-radius:0 4px 4px 0; transition:width .7s cubic-bezier(.22,.8,.3,1)}
.bar-row .vv{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; color:var(--ink-2);
  font-size:.77rem; text-align:right; white-space:nowrap}
.bar-row .vv em{font-style:normal; color:var(--muted)}

/* ---------- map ---------- */
.mapwrap{position:relative; background:var(--sea); border-radius:10px; overflow:hidden; border:1px solid var(--rule)}
.mapwrap svg{display:block; width:100%; height:auto}
.map-ctl{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; margin-top:16px}
@media (max-width:640px){ .map-ctl{grid-template-columns:auto 1fr; row-gap:10px} .map-ctl .readout{grid-column:1/-1} }
.playbtn{appearance:none; border:1px solid var(--rule); background:var(--surface-2); color:var(--ink);
  width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:.9rem; display:grid; place-items:center; flex:none}
.playbtn:hover{border-color:var(--k0); color:var(--k0)}
.playbtn:focus-visible{outline:2px solid var(--k0); outline-offset:2px}
input[type=range]{width:100%; accent-color:var(--k0); cursor:pointer}
.readout{min-width:210px; text-align:right; font-size:.85rem; line-height:1.35}
.readout .d{font-family:"JetBrains Mono",monospace; font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums}
.readout .p{font-weight:600; display:flex; align-items:center; gap:7px; justify-content:flex-end}
@media (max-width:640px){ .readout{text-align:left} .readout .p{justify-content:flex-start} }

/* ---------- table ---------- */
table{width:100%; border-collapse:collapse; font-size:.84rem}
th{text-align:left; font-family:"JetBrains Mono",monospace; font-size:.64rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); font-weight:500; padding:0 12px 9px 0; border-bottom:1px solid var(--rule); white-space:nowrap}
td{padding:8px 12px 8px 0; border-bottom:1px solid var(--rule-soft); vertical-align:top}
td.d{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap; font-size:.77rem}
td.n{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
tr.home td{color:var(--muted)}
.dot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px; vertical-align:1px}
.tag{font-size:.65rem; color:var(--muted); font-family:"JetBrains Mono",monospace; margin-left:6px}

details{border-top:1px solid var(--rule)}
details summary{cursor:pointer; padding:14px 0; font-weight:500; list-style:none; display:flex; align-items:center; gap:9px; color:var(--ink)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+"; font-family:"JetBrains Mono",monospace; color:var(--muted); font-size:1rem; width:12px}
details[open] summary::before{content:"–"}
details summary:focus-visible{outline:2px solid var(--k0); outline-offset:3px; border-radius:4px}
.details-body{padding-bottom:20px}

#tip{position:fixed; z-index:80; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:9px;
  padding:9px 12px; box-shadow:0 6px 28px -8px rgba(0,0,0,.35); max-width:250px; font-size:.82rem; line-height:1.42}
#tip .t-h{font-weight:600; margin-bottom:2px; display:flex; align-items:center; gap:7px}
#tip .t-s{color:var(--muted); font-family:"JetBrains Mono",monospace; font-size:.72rem; font-variant-numeric:tabular-nums}

.sk-label{font-family:"Public Sans",sans-serif; font-size:12px; fill:var(--ink);
  paint-order:stroke; stroke:var(--surface); stroke-width:3.5px; stroke-linejoin:round}
.sk-label.small{font-size:11px; fill:var(--ink-2)}
.sk-val{font-family:"JetBrains Mono",monospace; font-size:10px; fill:var(--muted)}
svg text{-webkit-user-select:none; user-select:none}

.foot{margin-top:56px; padding-top:20px; border-top:1px solid var(--rule); color:var(--muted);
  font-size:.79rem; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
.note{font-size:.8rem; color:var(--muted); margin-top:12px}

@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
